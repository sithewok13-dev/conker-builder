# Makes the ready-made parts every copy's build downloads (the "ios-parts" release of the public template):
# RT64's build tools for the Mac (file_to_c, spirv_cross_msl) and the results of CMake's checks, which take
# about 8 minutes on each build otherwise. Nothing of the game: it configures with an empty stand-in for the
# game's code. Run it by hand after changing port/ or tools/, or when the Mac runners get a new Xcode or CMake
# (build.yml says "No ready-made parts match" then). Only runs in the public template, where Mac minutes are free.
name: Ready-made parts (template only)
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  XCODE_VERSION: "16.4"

jobs:
  parts:
    if: ${{ github.repository == 'sithewok13-dev/conker-builder' }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          if [ -d "/Applications/Xcode_$XCODE_VERSION.app" ]; then sudo xcode-select -s "/Applications/Xcode_$XCODE_VERSION.app/Contents/Developer"; fi
          xcodebuild -version | head -1

      - name: The port's sources
        run: |
          tools/fetch-sources.sh app
          cd port/third_party/CBFD-Recompiled
          for patch in ../../patches/cbfd-recomp/*.patch; do git apply "$patch"; done

      - name: Configure with an empty stand-in for the game's code
        run: |
          stub="$RUNNER_TEMP/stub"
          mkdir -p "$stub/rsp"
          touch "$stub/funcs.h" "$stub/funcs_0.c" "$stub/tlb_pages.c" "$stub/rsp/audio_ucode.cpp"
          tools/configure.sh "$stub" io.github.player.conker

      - name: Pack the parts
        run: |
          name=$(tools/parts-key.sh)
          echo "NAME=$name" >> "$GITHUB_ENV"
          python3 tools/configure-seed.py build/CMakeCache.txt seed.cmake
          mkdir -p parts/host_tools && cp -R build/host_tools/bin parts/host_tools/
          cp seed.cmake parts/
          ls -lR parts
          tar -cJf "$name" -C parts .

      - name: Upload them to the "ios-parts" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ios-parts >/dev/null 2>&1 ||
            gh release create ios-parts --title "Ready-made parts" --latest=false \
              --notes "RT64's build tools and CMake's check results for the Mac build (made by parts.yml). Nothing of the game. Builds download the file that matches them."
          gh release upload ios-parts "$NAME" --clobber
          # keep the newest 6
          gh release view ios-parts --json assets --jq '.assets | sort_by(.createdAt) | reverse | .[6:] | .[].name' |
            while read -r old; do gh release delete-asset ios-parts "$old" --yes; done
